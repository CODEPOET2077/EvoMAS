[project]
name = "evomas"
version = "1.0.0"
description = "EvoMAS: Learning Execution-Time Workflows for Multi-Agent Systems"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
    { name = "Chengdong Xu" },
    { name = "Chao Yu" },
    { name = "Kaiqiang Ke" },
    { name = "Ziheng Liu" },
    { name = "Jiaqi Wei" },
    { name = "Zibo Shao" },
    { name = "Jungang Li" },
    { name = "Weile Guo" },
    { name = "Yiling Wu" },
]
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
include = ["src*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
